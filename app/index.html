<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>VERDE HEAT — Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">VERDE HEAT</span><span class="sub">Cover Studio — GTA-style poster maker</span></div>
  <div class="sizes" id="size-options" role="group" aria-label="Export size"></div>
  <div class="exports">
    <button id="export-one" type="button" class="primary">Export PNG</button>
    <button id="export-all" type="button">Export all 3 sizes</button>
  </div>
</header>
<main class="app">
  <aside class="panel left">
    <section>
      <h2>1 · Photos</h2>
      <p class="hint">Upload your own, or use a sample. Click a thumbnail to put it in the selected panel.</p>
      <label class="upload">+ Add photos <input id="upload" type="file" accept="image/*" multiple hidden></label>
      <div id="photo-strip" class="strip"></div>
    </section>
    <section>
      <h2>2 · Layout</h2>
      <div id="layout-options" class="opts"></div>
    </section>
    <section>
      <h2>3 · Grade</h2>
      <div id="grade-options" class="opts"></div>
      <button id="shuffle" type="button">Shuffle look</button>
    </section>
    <section>
      <h2>4 · Caption</h2>
      <label>Title <input id="caption-title" type="text" maxlength="24" value="VERDE HEAT"></label>
      <label>Script line <input id="caption-subtitle" type="text" maxlength="48" value="salt air &amp; fast hearts"></label>
      <label>Tagline <input id="caption-tagline" type="text" maxlength="60" value="SIX SOULS · ONE COAST · GOLDEN HOUR"></label>
      <label>Press quote <input id="caption-quote" type="text" maxlength="60" value="&quot;A sun-soaked blast.&quot;"></label>
    </section>
  </aside>
  <section class="stage">
    <canvas id="cover" width="1080" height="1350" aria-label="Live cover preview"></canvas>
    <p id="status" role="status"></p>
    <p class="hint">Drag a panel to move its photo · Scroll to zoom · Click a panel to edit it</p>
  </section>
  <aside class="panel right">
    <section>
      <h2 id="panel-title">Panel 1</h2>
      <div id="panel-list"></div>
    </section>
    <section>
      <label>Photo <select id="panel-photo"></select></label>
      <label>Zoom <span class="val" id="panel-zoom-val">1.00×</span><input id="panel-zoom" type="range" min="1" max="3" step="0.01" value="1"></label>
      <label>Move sideways <input id="panel-ox" type="range" min="-1" max="1" step="0.01" value="0"></label>
      <label>Move up / down <input id="panel-oy" type="range" min="-1" max="1" step="0.01" value="0"></label>
      <div class="row">
        <button id="autocrop" type="button">Auto-crop on face</button>
        <button id="fill-all" type="button">Use in every panel</button>
      </div>
      <label>Role tag <input id="panel-role" type="text" maxlength="20" value="THE QUEEN"></label>
      <label>Place <input id="panel-place" type="text" maxlength="20" value="VERDE BAY"></label>
      <label>Time <input id="panel-time" type="text" maxlength="20" value="GOLDEN HOUR"></label>
      <label>Story line <input id="panel-micro" type="text" maxlength="60" value="She came back for one last summer."></label>
      <label>Warmth <span class="val" id="panel-warmth-val">0.0</span><input id="panel-warmth" type="range" min="-1" max="1" step="0.1" value="0"></label>
    </section>
  </aside>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
